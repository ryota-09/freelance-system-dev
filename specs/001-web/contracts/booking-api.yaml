openapi: 3.0.3
info:
  title: Consultation Booking API
  description: API specification for 30-minute free consultation booking on Fukui Freelance Web Development site
  version: 1.0.0
servers:
  - url: https://yourdomain.com/api
    description: Production server
  - url: http://localhost:3000/api
    description: Development server

paths:
  /booking:
    post:
      summary: Submit consultation booking request
      description: Submits a new consultation booking request. Triggers confirmation email to both client and freelancer.
      operationId: submitBooking
      tags:
        - Booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
            example:
              companyName: "美容室サクラ"
              contactName: "佐藤花子"
              email: "sato@salon-sakura.example.com"
              phone: "0776-98-7654"
              preferredFormat: "online"
              preferredDateRanges:
                - startDate: "2025-11-01T10:00:00+09:00"
                  endDate: "2025-11-01T12:00:00+09:00"
                  timeOfDay: "morning"
                - startDate: "2025-11-02T14:00:00+09:00"
                  endDate: "2025-11-02T17:00:00+09:00"
                  timeOfDay: "afternoon"
              needsDescription: "予約システムの導入を検討しています。無断キャンセル対策も含めて相談したいです。"
              location: null
      responses:
        '200':
          description: Booking submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
              example:
                success: true
                bookingId: "660e8400-e29b-41d4-a716-446655440001"
                message: "無料相談のご予約を承りました。確認メールをお送りしました。"
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: "Validation failed"
                details:
                  preferredDateRanges: "希望日時を最低1つ選択してください"
                  location: "対面形式の場合、場所を入力してください"
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: "Too many requests"
                message: "しばらく時間をおいてから再度お試しください。"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: "Internal server error"
                message: "送信中にエラーが発生しました。お手数ですが、お電話でお問い合わせください。"

components:
  schemas:
    BookingRequest:
      type: object
      required:
        - companyName
        - contactName
        - email
        - phone
        - preferredFormat
        - preferredDateRanges
        - needsDescription
      properties:
        companyName:
          type: string
          minLength: 1
          maxLength: 200
          description: Company or business name
          example: "美容室サクラ"
        contactName:
          type: string
          minLength: 1
          maxLength: 100
          description: Contact person name
          example: "佐藤花子"
        email:
          type: string
          format: email
          maxLength: 255
          description: Email address
          example: "sato@salon-sakura.example.com"
        phone:
          type: string
          pattern: '^[0-9-]+$'
          maxLength: 50
          description: Japanese phone number (digits and hyphens only)
          example: "0776-98-7654"
        preferredFormat:
          type: string
          enum:
            - online
            - in-person
          description: Consultation format preference
          example: "online"
        preferredDateRanges:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/DateRange'
          description: Preferred date/time options (1-5 options)
        needsDescription:
          type: string
          minLength: 1
          maxLength: 1000
          description: Brief description of project needs
          example: "予約システムの導入を検討しています。無断キャンセル対策も含めて相談したいです。"
        location:
          type: string
          maxLength: 100
          nullable: true
          description: Required if preferredFormat is "in-person". Must be within Fukui Prefecture.
          example: null

    DateRange:
      type: object
      required:
        - startDate
        - endDate
        - timeOfDay
      properties:
        startDate:
          type: string
          format: date-time
          description: Start of availability window (ISO 8601)
          example: "2025-11-01T10:00:00+09:00"
        endDate:
          type: string
          format: date-time
          description: End of availability window (ISO 8601)
          example: "2025-11-01T12:00:00+09:00"
        timeOfDay:
          type: string
          enum:
            - morning
            - afternoon
            - evening
            - anytime
          description: General time preference
          example: "morning"

    BookingResponse:
      type: object
      required:
        - success
        - bookingId
        - message
      properties:
        success:
          type: boolean
          description: Whether submission was successful
          example: true
        bookingId:
          type: string
          format: uuid
          description: Unique booking identifier
          example: "660e8400-e29b-41d4-a716-446655440001"
        message:
          type: string
          description: User-facing success message
          example: "無料相談のご予約を承りました。確認メールをお送りしました。"

    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          description: Always false for errors
          example: false
        error:
          type: string
          description: Error type
          example: "Validation failed"
        message:
          type: string
          description: User-facing error message (Japanese)
          example: "入力内容に誤りがあります。"
        details:
          type: object
          additionalProperties:
            type: string
          description: Field-level error messages
          example:
            preferredDateRanges: "希望日時を最低1つ選択してください"
            location: "対面形式の場合、場所を入力してください"

  securitySchemes:
    RateLimitToken:
      type: apiKey
      in: header
      name: X-RateLimit-Token
      description: Optional token for rate limit bypass (internal use)

security: []
